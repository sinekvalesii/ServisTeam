# Servis Team — tek sunucuda tam kurulum (uygulama + PostgreSQL + Caddy otomatik HTTPS)
# Kullanım: .env dosyasını doldurun, sonra:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: servisteam
      POSTGRES_USER: servisteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde zorunlu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servisteam"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://servisteam:${POSTGRES_PASSWORD}@db:5432/servisteam
      NODE_ENV: production
      TRUST_PROXY: "1"
      UPLOAD_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

  # Günlük veritabanı yedeği ./backups klasörüne (14 gün saklanır). Yedekleri düzenli olarak sunucu dışına da kopyalayın.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U servisteam servisteam | gzip > /backups/servisteam-$$(date +%F).sql.gz;
        find /backups -name "*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      - db

volumes:
  pgdata:
  uploads:
  caddy_data:
